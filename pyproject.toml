[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jg-investing"
version = "0.1.0"
description = "Generator for the JG Investment Portfolio webpage."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jan Grzybek" }]
license = "MIT"
license-files = ["LICENSE"]
# Floors AND ceilings. The floors alone used to carry a promise they
# could not keep: the comment here claimed a major upgrade that broke
# the integration shape "will fail to install rather than fail at
# runtime in CI", but ``>=`` cannot block a major bump. yfinance went
# from the declared ``>=0.2.40`` to a locked 1.6.0 -- two majors -- with
# nothing objecting, and Pillow from ``>=10`` to 12.
#
# The upper bounds are what actually enforce it. A vendor major now
# fails at ``pip install`` and has to be widened by hand, which is the
# review the comment always described. Ceilings are pinned one major
# above the floor, so a minor/patch bump still flows through Dependabot
# untouched and only a major stops the line.
#
# ``pip-compile`` reads these directly from this ``pyproject.toml`` when
# regenerating ``requirements.txt`` / ``requirements-dev.txt`` -- see
# CONTRIBUTING.md for the one-liners.
dependencies = [
  "gspread>=6.2,<7",
  "yfinance>=1.6,<2",
  "requests>=2.32,<3",
  "python-dateutil>=2.9,<3",
  "Pillow>=12,<13",
  "cairosvg>=2.7,<3",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "beautifulsoup4>=4.12",
  "html5lib>=1.1",
  "pre-commit>=3.7",
  "rjsmin>=1.2",
  "csscompressor>=0.9",
  # ``pip-compile`` regenerates the pinned lock files from this
  # ``pyproject.toml`` itself (no separate ``requirements.in``); the
  # CONTRIBUTING guide documents the one-liner.
  "pip-tools>=7",
  # Typeshed packages so mypy can resolve ``dateutil`` / ``requests``
  # annotations cleanly. Previously declared inline in the pre-commit
  # mypy hook; lifted here so the dev environment, CI and the
  # ``language: system`` pre-commit hook all see the same stubs.
  "types-python-dateutil",
  "types-requests",
  # Browser smoke tests (client-side interactions + axe a11y scan).
  "playwright>=1.49",
  "pytest-playwright>=0.6",
  "axe-playwright-python>=0.1",
]

[project.urls]
Homepage = "https://jan-grzybek.github.io/investing/"
Source = "https://github.com/jan-grzybek/investing"
Issues = "https://github.com/jan-grzybek/investing/issues"

[tool.setuptools]
# The page generator lives in ``investing/``; ``python -m investing``
# runs the leak-safe production entrypoint (used by
# ``.github/workflows/main.yml``). The local-preview helper
# (``scripts/preview.py``) is also picked up so editable installs
# and lint targets see it alongside the package.
packages = ["investing", "investing.webpage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``pythonpath = ["."]`` lets the test suite resolve
# ``import investing`` without any ``sys.path`` mutation in
# ``tests/conftest.py``.
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "browser: end-to-end tests that require Playwright (Chromium)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["investing"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
# A one-way ratchet. The floor only ever moves *up*: whenever a change
# lifts real coverage, raise this to match, and never lower it to make
# a red build green. A drop below the floor fails CI rather than
# silently eroding the safety net.
#
# 87 -> 95 when the edge-case suite landed. 95 -> 96 when the retry /
# archive-fallback work landed. 96 -> 97 -> 99 when the review pass
# closed what was left: the leak-safe wrapper's partial-teardown paths
# (an ``os.dup`` that fails mid-sequence), ``get_benchmarks``, the
# gspread per-worksheet fallback and row-parse diagnostics, the
# store-backed FX merge, the split-on-trade-boundary invariant, the OG
# logo rasteriser, the four renderer buckets, and the production
# entrypoints.
#
# **99 is the standing floor, not a high-water mark to be admired.**
# New code arrives with its branches covered or the build fails. The
# remaining ~1% is a handful of defensive guards behind other guards
# (a merged position group with no BUY, reachable only if a leg's own
# ledger check is bypassed first) -- the kind of belt-and-braces that
# is correct to keep and dishonest to fake a test for.
fail_under = 99

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".venv",
  ".testvenv",
  "preview",
  "logos",
  "assets",
]

[tool.ruff.lint]
# Conservative starter set: pyflakes, pycodestyle errors, isort, pyupgrade,
# bugbear, comprehensions. Tightening can come once the codebase has been
# through a first formatting pass.
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# The ignore list is deliberately small: each entry corresponds to a
# rule that currently fires in the codebase and that we've chosen to
# accept rather than rewrite around. Audited regularly -- previous
# entries (E741, B008, SIM117, RUF012) were dropped once it became
# clear the patterns they guarded against no longer existed.
ignore = [
  # HTML / SVG / JSON-LD prose builders carry intentionally long
  # string literals; reflowing them would obscure the rendered
  # output.
  "E501",   # line too long
  # ``holdings.py``'s TSR / XIRR branch reads more clearly as an
  # ``if`` block than a ternary because the comment immediately
  # above explains the two cases as a pair of branches.
  "SIM108", # ternary simplification (sometimes harms readability)
  # ``performance.py``'s top-10 bucket construction concatenates a
  # sliced list with the synthetic ``Other equities`` tuple; the
  # PEP 448 unpacking form (``[*ranked[:10], (...)]``) reads less
  # well than the explicit concatenation when the ``+`` is the
  # whole point of the expression.
  "RUF005", # iterable unpacking vs concatenation (legacy style)
]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures imported from ``tests._webpage_support`` /
# ``conftest`` get flagged as F811 (redefined) and F401 (unused) by
# ruff because the link between "imported name" and "fixture
# parameter" only exists at collection time. The pattern is
# conventional in pytest and rewriting the suite around indirect
# fixture lookup would obscure intent for no real safety benefit.
"tests/*" = ["B011", "RUF018", "F401", "F811", "RUF100"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# Strict, with no exemptions. The permissive-holdout list that used
# to sit below is gone: the five modules on it (holdings, performance,
# sheets, webpage._page, webpage.og_image) needed 24 annotations
# between them, and typing them surfaced real drift -- the view layer
# was taking bare ``dict`` where ``HoldingSummary`` / ``TotalReturn``
# already existed, so the TypedDicts were not actually being checked
# at the boundary they were written for. Do NOT reintroduce the list;
# a new module ships annotated or the build fails.
disallow_untyped_defs = true
ignore_missing_imports = true
