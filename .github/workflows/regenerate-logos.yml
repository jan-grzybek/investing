name: Regenerate cropped logos

# Server-side safety net for the ``logos/tight/`` mirror.
#
# ``scripts/tighten_logos.py`` rebuilds ``logos/tight/`` from
# ``logos/``: every SVG gets viewBox-cropped to its visible silhouette
# and every non-SVG is copied through verbatim. The renderer reads
# from ``logos/tight/`` exclusively (see
# ``investing.paths.LOGOS_ADDRESS``), so leaving the two out of sync
# would either ship the placeholder logo or render stale crops.
#
# The matching pre-commit hook (``tighten-logos`` in
# ``.pre-commit-config.yaml``) regenerates locally on every commit
# that touches a source logo, and the ``test.yml`` CI step fails
# pull requests where the committed mirror drifts from a fresh
# build. This workflow covers the remaining branch: a direct push
# to ``main`` that updates / adds / deletes a source logo without
# regenerating the mirror. It re-runs the script and commits the
# mirror back so the next deploy serves the right bytes.
on:
  push:
    branches: [main]
    paths:
      # Only fire on changes to source files directly inside
      # ``logos/`` -- the glob does not span ``/`` so changes
      # under ``logos/tight/`` (= the regenerated output of this
      # very workflow) do not trigger another run. That breaks
      # the obvious loop without needing any further filtering.
      - 'logos/*.svg'
      - 'logos/*.png'
      - 'logos/*.jpg'
      - 'logos/*.jpeg'
  workflow_dispatch: {}

# The rebuilt ``logos/tight/`` mirror is pushed back to ``main`` with
# the ``BOT_PUSH_KEY`` deploy key, not ``GITHUB_TOKEN``: the "main:
# require Tests" ruleset rejects pushes whose commit has no passing
# Tests run, and on a personal repo only a deploy key can bypass it.
# The key never reaches the job that runs the dependency set; see the
# ``push`` job. The token itself only needs to read.
permissions:
  contents: read

# A second push to ``logos/`` while we are still regenerating the
# previous batch should not race: serialise per-branch so the later
# run picks up the cumulative change set.
concurrency:
  group: regenerate-logos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.mirror.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install system deps
        # ``cairosvg`` (used by ``scripts/tighten_logos.py`` to
        # rasterise the source SVGs for the tight-bbox probe) needs
        # the system-level ``libcairo2`` shared library; pip cannot
        # install that for us.
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2

      - name: Install Python deps
        # Only the runtime requirements are needed -- the cropping
        # script does not import anything from the dev-only set
        # (ruff / mypy / pytest), so ``requirements.txt`` is the
        # smaller install.
        run: pip install -r requirements.txt

      - name: Regenerate logos/tight/
        run: python scripts/tighten_logos.py

      - name: Collect regenerated mirror
        # This job has run the third-party dependency set, so it never
        # holds the push key: anything that set left behind (a git
        # hook, a shadowed ``git`` on ``$GITHUB_PATH``, a background
        # process) would still be here for a later step to meet. It
        # only hands the mirror to the ``push`` job as an artifact.
        id: mirror
        run: |
          if [[ -z "$(git status --porcelain logos/tight/)" ]]; then
            echo "logos/tight/ already in sync; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/bot-changes/logos"
          cp -R logos/tight "$RUNNER_TEMP/bot-changes/logos/tight"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload regenerated mirror
        if: steps.mirror.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bot-changes
          path: ${{ runner.temp }}/bot-changes
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  push:
    # Commits the mirror and pushes it with the ``BOT_PUSH_KEY`` deploy
    # key, in a job of its own: every job gets a fresh runner, and this
    # one installs nothing and runs no code from the dependency set --
    # a clean checkout, the artifact, and ``scripts/bot_push.sh``, which
    # takes only ``logos/tight/`` from the artifact and fails on
    # anything else before it reads the key.
    #
    # ``[skip ci]`` keeps this commit from re-triggering any workflow
    # run (a deploy-key push would otherwise start one) -- the
    # ``Tests`` and main deploy chains both skip this commit on
    # purpose, so the next scheduled or manual deploy is the one that
    # picks up the new tight crops. That's deliberate: it keeps a
    # single source of truth (the original push) for the deploy
    # cadence and avoids paying compute for a deploy that only updates
    # how a few logos render.
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download regenerated mirror
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bot-changes
          path: ${{ runner.temp }}/bot-changes

      - name: Commit and push
        env:
          BOT_PUSH_KEY: ${{ secrets.BOT_PUSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/bot_push.sh "$RUNNER_TEMP/bot-changes"
          logos/tight "chore(logos): regenerate logos/tight/ mirror [skip ci]"
