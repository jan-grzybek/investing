name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Restrict the default ``GITHUB_TOKEN`` to the least the job needs:
# pytest only checks out the tree and installs deps from PyPI, so
# read-only access to the repo contents is enough. Without this block
# the token inherits whatever the repo/org default is (often
# read-write), which CodeQL's ``actions/missing-workflow-permissions``
# query flags. Sibling ``main.yml`` declares its own permissions block
# explicitly for the same reason.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches ``.python-version`` and the interpreter the lock
          # files were compiled with. ``requires-python`` stays at
          # ">=3.12" and the pytest matrix below still covers it, so
          # the support floor is unchanged -- this only pins the
          # single-version jobs to one interpreter instead of three.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install deps
        # Pinned dev toolchain. An unpinned ``pip install -e '.[dev]'``
        # meant ruff / mypy / pytest / playwright came from whatever
        # PyPI served that morning, so a lint finding could appear or
        # vanish with no code change. The editable install that follows
        # adds the package itself without touching the resolved set.
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Pre-commit hooks
        # Runs the hooks CI does not otherwise enforce -- stylelint over
        # ``assets/src/css`` and eslint over ``assets/src/js``. Both were
        # local-only before, so a contributor who skipped the hook could
        # ship CSS/JS that no gate ever looked at. The ruff / mypy hooks
        # duplicate the dedicated steps below cheaply; the build-assets
        # and tighten-logos hooks have their own ``--check`` steps in the
        # pytest job and are skipped here.
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: build-assets,tighten-logos

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy investing scripts/preview.py

  pytest:
    runs-on: ubuntu-26.04
    strategy:
      # Don't short-circuit one Python version's failure into the others;
      # we want to see every supported runtime's report on the same PR.
      fail-fast: false
      matrix:
        # The deploy and lint jobs run 3.14; these rows keep us honest
        # that the codebase still works across the whole supported
        # range declared by ``requires-python`` (">=3.12"), which is
        # also what ruff's ``target-version`` and mypy's
        # ``python_version`` are checked against.
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps
        # ``cairosvg`` (runtime dep in ``pyproject.toml``) needs the
        # system-level ``libcairo2`` shared library; pip can't
        # install that for us.
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2

      - name: Install deps
        # Deliberately unpinned here, unlike the lint job: this matrix
        # spans 3.12-3.14 and ``requirements-dev.txt`` is compiled
        # against 3.14 alone, so a pinned install would fail to resolve
        # on the older rows. The lint job above is the pinned one; this
        # job's purpose is to prove the package works across the
        # supported range, which means resolving per version.
        run: pip install -e '.[dev]'

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Verify generated assets match readable sources
        # Pre-commit runs ``scripts/build_assets.py`` whenever
        # ``assets/src/`` changes, but contributors who skip the
        # hook can still ship drift. This step fails CI when
        # ``assets/<name>.js`` / ``assets/page.css`` are not byte-
        # identical to the freshly-built versions, which would
        # silently break the CSP hashes in
        # ``investing/webpage/head.py``.
        run: python scripts/build_assets.py --check

      - name: Verify cropped logos match source originals
        # Same contract as the asset-minify check above, but for the
        # logo crop mirror: ``scripts/tighten_logos.py`` rebuilds
        # ``logos/tight/`` from ``logos/``, and CI fails when the
        # committed crops don't match a fresh regeneration. The
        # production pre-commit hook (``tighten-logos``) keeps this
        # in sync locally, so this step is the PR gate that prevents
        # a half-updated mirror from merging in the first place.
        #
        # Deliberately scoped to ``pull_request`` only: a push to
        # ``main`` that introduces drift (e.g. a new source logo
        # committed without rerunning the cropper) is recovered
        # server-side by ``regenerate-logos.yml``, which rebuilds
        # ``logos/tight/`` and commits the mirror back. Failing this
        # step on push would block ``main.yml`` -- whose deploy is
        # gated on ``Tests`` success via ``workflow_run`` -- from
        # ever publishing the new logo, because the auto-commit from
        # ``regenerate-logos.yml`` uses the default ``GITHUB_TOKEN``
        # which by design does not retrigger workflows. The
        # ``WaitForRegenerate`` guard in ``main.yml`` already
        # serialises the deploy behind the regenerate workflow's
        # commit, so by the time we ship the page the mirror is
        # back in sync.
        if: github.event_name == 'pull_request'
        run: python scripts/tighten_logos.py --check

      - name: Run pytest with coverage
        # ``--cov`` enables the coverage plugin from ``pytest-cov``;
        # the config in ``pyproject.toml`` selects the ``investing``
        # package as the source set, turns on branch coverage, and
        # enforces the ``fail_under`` floor declared in
        # ``[tool.coverage.report]`` so a coverage drop fails the
        # build. Strict html5lib parsing of the synthetic preview lives
        # in ``tests/test_preview_html.py`` alongside the rest of the
        # suite.
        run: python -m pytest -v --cov=investing --cov-report=term-missing

  # TEMPORARY -- pre-flight only, never to be merged.
  #
  # Mirrors the OS-sensitive half of ``main.yml``'s ``Update`` job and
  # of ``regenerate-logos.yml`` on the production lockfile, minus every
  # step that needs a secret. Neither workflow runs on pull requests,
  # so this is the only way to see them on the new image before
  # ``ubuntu-latest`` moves. The 24.04 row is the control: same commit,
  # same lock, same minute.
  deploy-path-preflight:
    name: deploy path, prod lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Image and library versions
        run: |
          . /etc/os-release && echo "os: $PRETTY_NAME"
          echo "kernel: $(uname -r)"
          python --version
          dpkg-query -W -f='libcairo2 package: ${Version}\n' libcairo2
          python -c "import cairocffi, cairosvg, PIL; print('cairo', cairocffi.cairo_version_string(), '| cairosvg', cairosvg.__version__, '| Pillow', PIL.__version__)"

      - name: Cropped logos match (what regenerate-logos.yml would rebuild)
        run: python scripts/tighten_logos.py --check

      - name: Show crop drift, if any
        if: failure()
        run: |
          python scripts/tighten_logos.py || true
          git status --porcelain logos/tight/
          git diff --stat logos/tight/ | tail -3
          git diff -U0 logos/tight/ | grep -E '^[+-]<svg' | cut -c1-240 | head -40

      - name: Render the synthetic page (what the deploy build does, minus the sheet)
        run: |
          python scripts/preview.py --out "$RUNNER_TEMP/preview"
          python - <<'EOF'
          import hashlib, os, pathlib
          from PIL import Image
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "preview"
          for name in ("index.html", "og-image.png", "sitemap.xml", "robots.txt"):
              data = (out / name).read_bytes()
              print(f"{name}: {len(data)} bytes sha256={hashlib.sha256(data).hexdigest()[:16]}")
          image = Image.open(out / "og-image.png")
          image.load()
          assert image.size == (1200, 630), image.size
          pixels = hashlib.sha256(image.convert("RGBA").tobytes()).hexdigest()[:16]
          print(f"og-image.png: {image.format} {image.size} {image.mode} pixel-sha256={pixels}")
          EOF
