<?xml version="1.0" encoding="UTF-8"?>
<!--
  JG monogram: the site mark.

  The previous export carried an Inkscape document tree in which the
  whole mark was present but marked display:none, so tabs, bookmarks
  and the README badge rendered a bare orange circle while
  apple-touch-icon.png was the only surface carrying an identity at
  all. One artwork now drives all four icon files.

  The letterforms are Roboto Black, set to the design's own spec: cap
  height 20 on the 64 grid and minus 0.04em of tracking between the
  two glyphs, optically centred on both axes. Roboto is what the
  page's font-family stack falls through to, and what the OG card is
  now drawn in (see fonts/, vendored under Apache 2.0), so the mark,
  the card and the page header are all one typeface.

  The outlines are baked in as a path rather than set as live text.
  An SVG favicon cannot rely on a webfont, and the .png / .ico
  rasters have to match the .svg exactly. There is no build step:
  these are committed artwork, regenerated by hand against fonts/ if
  the spec ever changes.

  Navy accent-bench plate, orange accent letters: the same two tokens
  the return chart uses for benchmark and portfolio, so the icon reads
  as part of the page's deck.

  apple-touch-icon.png rasterises this same monogram on a full-bleed
  square plate (iOS applies its own squircle mask). The circular plate
  below is what the .svg / .png / .ico favicons show.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="JG">
  <title>JG</title>
  <circle cx="32" cy="32" r="32" fill="#023047"/>
  <path fill="#fb8500" d="M25.13 35.63V22.28H29.81V35.63Q29.81 38.55 27.87 40.28Q25.93 42.00 23.12 42.00Q20.18 42.00 18.29 40.51Q16.41 39.02 16.41 35.85H21.11Q21.11 37.34 21.63 37.87Q22.14 38.39 23.12 38.39Q25.13 38.39 25.13 35.63ZM47.59 31.34V39.33Q46.84 40.16 44.92 41.08Q43.00 42.00 39.86 42.00Q35.98 42.00 33.64 39.55Q31.29 37.10 31.29 32.55V31.47Q31.29 26.93 33.63 24.46Q35.97 22.00 39.60 22.00Q43.62 22.00 45.45 23.86Q47.28 25.71 47.58 28.63H43.08Q42.86 27.18 42.13 26.40Q41.39 25.61 39.76 25.61Q38.07 25.61 37.06 27.06Q36.06 28.51 36.06 31.45V32.55Q36.06 38.39 40.19 38.39Q41.31 38.39 41.96 38.12Q42.61 37.85 42.90 37.58V34.56H39.64V31.34Z"/>
