<?xml version="1.0" encoding="UTF-8"?>
<!--
  JG monogram: the site mark.

  Hand-authored rather than exported from a drawing tool, because the
  file is served as-is to browser tabs, so every byte here is shipped
  bytes. The previous export carried an Inkscape document tree in
  which the whole mark (a Roboto "G" plus crosshair rules) was present
  but marked display:none, so tabs, bookmarks and the README badge
  rendered a bare orange circle while apple-touch-icon.png was the
  only surface carrying an identity at all. One artwork now drives
  all four icon files.

  Letterforms are stroked skeletons rather than glyph outlines, so the
  file has no font dependency and rasterises identically on every
  machine. Geometry on the 64x64 grid:

    * navy accent-bench plate, orange accent letters: the same two
      tokens the return chart uses for benchmark and portfolio, so
      the icon reads as part of the page's deck;
    * cap height 21 (16 of skeleton plus the 5 stroke), monogram
      width 40, which is 62% of the plate, centred on both axes;
    * the J's hook and the G's bowl sit within a pixel of the same
      radius so both letters carry the same curvature at 16px, where
      each is only about five device pixels tall. The G's aperture is
      cut high and its bar dropped below the optical centre so the
      counter survives that reduction instead of filling in;
    * 7 of sidebearing between the two letters, which is generous for
      a monogram and deliberately so: at 16px it is the difference
      between reading "JG" and reading one orange blob.

  apple-touch-icon.png rasterises this same monogram on a full-bleed
  square plate (iOS applies its own squircle mask). The circular
  plate below is what the .svg / .png / .ico favicons show.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="JG">
  <title>JG</title>
  <circle cx="32" cy="32" r="32" fill="#023047"/>
  <g fill="none" stroke="#fb8500" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.5 24v9a7 7 0 0 1-7 7"/>
    <path d="M45.74 25.22A8 8 0 1 0 49.25 34H43"/>
  </g>
</svg>
